name: publish-slides

# Publish the TURBO-GP slide deck (slides/) with GitHub Pages at
# https://pfleget.github.io/treegp/. Pages must be enabled once in the
# repository settings (Settings > Pages > Source: GitHub Actions).

on:
  push:
    branches:
      - "master"
    paths:
      - "slides/**"
      - ".github/workflows/pages.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: slides
      - id: deployment
        uses: actions/deploy-pages@v4
